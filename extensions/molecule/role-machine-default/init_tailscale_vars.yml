---
- name: Use tailscale service
  ansible.builtin.set_fact:
    tailscale_authkey: "{{ lookup('ansible.builtin.env', 'TAILSCALE_CI_KEY') }}"
  when: not (lookup('ansible.builtin.env', 'USE_HEADSCALE', default=false) | bool)

# The preauth key is created and stored by role-machine-default/prepare.yml
- name: Use headscale service
  vars:
    combined_args: "{{ tailscale_args|default('') }} --login-server=http://headscale:8080"
  ansible.builtin.set_fact:
    tailscale_authkey: "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') + '/headscale_authkey') }}"
    tailscale_args: "{{ combined_args }}"
  when: lookup('ansible.builtin.env', 'USE_HEADSCALE', default=false) | bool
